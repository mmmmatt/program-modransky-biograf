name: Program kina
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node fetch-program.test.js
      - run: node fetch-program.js
      - run: |
          git config user.name "program-kina-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add program.json
          git diff --cached --quiet || git commit -m "Program kina $(date -u +%F)"
          git push
