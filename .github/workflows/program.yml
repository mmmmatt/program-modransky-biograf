name: Program kina
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node fetch-program.test.js
      - run: node fetch-program.js
      - run: npm install --no-save playwright@1.48.2
      - run: npx playwright install --with-deps chromium
      - name: Akce KC12
        run: node fetch-kc12.js
        continue-on-error: true
      - run: |
          git config user.name "program-kina-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add program.json kc12.json
          git diff --cached --quiet || git commit -m "Program $(date -u +%F)"
          git push
