name: Program kina
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run scrape
      - run: |
          git config user.name "program-kina-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add program.json
          git diff --cached --quiet || git commit -m "Program kina $(date -u +%F)"
          git push
